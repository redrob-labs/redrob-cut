# Quick static checks for the release pipeline (seconds, no Rust build): workflow syntax,
# packaging shell/PowerShell scripts, and the Linux desktop/AppStream metadata.
name: Packaging lint

on:
  push:
    branches: [main, release]
    paths: [".github/workflows/**", "packaging/**", "assets/app-icon/**"]
  pull_request:
    paths: [".github/workflows/**", "packaging/**", "assets/app-icon/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: 1.7.12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck desktop-file-utils appstream libxml2-utils
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" actionlint
      - name: actionlint
        run: |
          "$RUNNER_TEMP/actionlint" -color
      - name: shellcheck
        run: shellcheck packaging/*.sh packaging/*/*.sh
      - name: Linux tarball installer
        run: python3 packaging/linux/test_install.py
      - name: PowerShell
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem packaging/windows/*.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Output "::error file=$($f.Name)::$_" }; exit 1 }
            Write-Output "ok $($f.Name)"
          }
      - name: XML, desktop entry, AppStream
        run: |
          xmllint --noout packaging/windows/redrob-film.wxs packaging/macos/*.plist* packaging/linux/*.xml*
          # Windows Installer needs Icon ids ending in .ico or .exe, or shortcuts show a blank icon.
          if grep -oE '<Icon Id="[^"]*"' packaging/windows/redrob-film.wxs | grep -vE '\.(ico|exe)"$'; then
            echo "::error::Icon Id must end in .ico or .exe"; exit 1
          fi
          desktop-file-validate packaging/linux/ai.redrob.film.desktop
          sed -e 's/@VERSION@/0.0.0/' -e 's/@DATE@/2026-01-01/' packaging/linux/ai.redrob.film.metainfo.xml.in >"$RUNNER_TEMP/ai.redrob.film.metainfo.xml"
          appstreamcli validate --no-net --explain "$RUNNER_TEMP/ai.redrob.film.metainfo.xml"
      - name: Release asset matrix
        # The three targets, and nothing else: the launcher manifest and apps/filmcraft/src/update.rs name these files.
        run: |
          grep -Fq -- '--arch universal' .github/workflows/release.yml
          grep -Fq -- '-Arch x64 -SkipBuild' .github/workflows/release.yml
          grep -Fq 'FORMATS="deb tar"' packaging/linux/package.sh
          if grep -niE 'appimage|zsync|flatpak|\brpm\b|arm64|i686|windows-x86|ubuntu-22\.04-arm|riscv|freebsd' .github/workflows/release.yml packaging/linux/package.sh packaging/windows/package.ps1; then
            echo "::error::a removed release target is back (see docs/releasing.md)"; exit 1
          fi
