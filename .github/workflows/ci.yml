# Pull-request CI for the Rust code: formatting, clippy and the tests of OUR crates (the shell
# `filmcraft`, the engine and the egui UI) with `--profile ci` (root Cargo.toml: every dependency
# at opt-level 0, no incremental), which is what keeps a run in minutes instead of tens of them.
# The effectcraft subtree (crafts/effectcraft/**) is upstream code gated upstream; it is compiled
# here only as a dependency. The release workflow does not repeat any of this.
name: CI

on:
  pull_request:
    paths-ignore: ["**.md", "docs/**", "packaging/**", "assets/brand/**"]
  push:
    branches: [develop, main]
    paths-ignore: ["**.md", "docs/**", "packaging/**", "assets/brand/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Our crates and the shell. Not `--workspace`: that would lint and test the effectcraft subtree too.
  OUR_CRATES: -p filmcraft -p filmcraft-ui-egui -p filmcraft-engine

jobs:
  rust:
    name: fmt, clippy, test (profile ci)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the system headers winit, cpal and rfd need
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libasound2-dev libgtk-3-dev fonts-noto-cjk
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-profile
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: |
          # shellcheck disable=SC2086 # OUR_CRATES is a list of flags on purpose
          cargo clippy $OUR_CRATES --all-targets --locked --profile ci -- -D warnings
      - name: Tests
        run: |
          # shellcheck disable=SC2086
          cargo test $OUR_CRATES --locked --profile ci
