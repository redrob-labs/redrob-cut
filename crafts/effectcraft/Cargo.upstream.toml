[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.10.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/storytold/effectcraft"

[workspace.dependencies]
# internal
redrob-effects-time = { path = "crates/time" }
redrob-effects-geom = { path = "crates/geom" }
redrob-effects-color = { path = "crates/color" }
redrob-effects-raster = { path = "crates/raster" }
redrob-effects-path = { path = "crates/path" }
redrob-effects-keyframe = { path = "crates/keyframe" }
redrob-effects-project = { path = "crates/project" }
redrob-effects-text = { path = "crates/text" }
redrob-effects-effects = { path = "crates/effects" }
redrob-effects-track = { path = "crates/track" }
redrob-effects-segment = { path = "crates/segment" }
redrob-effects-model = { path = "crates/model" }
redrob-effects-render = { path = "crates/render" }
redrob-effects-gpu = { path = "crates/gpu" }
redrob-effects-media = { path = "crates/media" }
redrob-effects-export = { path = "crates/export" }
redrob-effects-expr = { path = "crates/expr" }
redrob-effects-lottie = { path = "crates/lottie" }
redrob-effects-interchange = { path = "crates/interchange" }
redrob-effects-pdf = { path = "crates/pdf" }
redrob-effects-psd = { path = "crates/psd" }
redrob-effects-vp9enc = { path = "crates/vp9enc" }
redrob-effects-svg = { path = "crates/svg" }
redrob-effects-engine = { path = "crates/engine" }
redrob-effects-host = { path = "crates/host" }
redrob-effects-ui-egui = { path = "crates/ui-egui" }
redrob-effects-automation = { path = "crates/automation" }
redrob-effects-opusenc = { path = "crates/opusenc" }
redrob-effects-script = { path = "crates/script" }
redrob-effects-hevcenc = { path = "crates/hevcenc" }
redrob-effects-av1enc = { path = "crates/av1enc" }
redrob-effects-plugin = { path = "crates/plugin" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
rayon = "1"
# std::time::Instant/SystemTime on native; the browser clock on wasm32 (std's panic there).
web-time = "1"
gif = "0.14"
proptest = "1"

# scripting (expressions)
boa_engine = { version = "0.22", default-features = false }
# WebAssembly effect plug-ins (sandboxed interpreter; MIT/Apache-2.0, pure Rust)
wasmi = { version = "2", default-features = false, features = ["std", "validate", "wat", "deterministic", "portable-dispatch"] }

# geometry / fonts
kurbo = { version = "0.13", features = ["serde"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
skrifa = { version = "0.44", default-features = false, features = ["std"] }
harfrust = { version = "0.12", default-features = false, features = ["std"] }
exr = "1.74"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# media codecs + containers: FilmCraft's pure-Rust crates, pinned to a revision (plan/adr/0001).
# Only `crates/media`, `crates/export` and `crates/interchange` may depend on these.
redrob-film-codecs = { git = "https://github.com/storytold/filmcraft", rev = "2c5ba7a72619935f0481f99d59409e0d1844b234" }
redrob-film-media = { git = "https://github.com/storytold/filmcraft", rev = "2c5ba7a72619935f0481f99d59409e0d1844b234" }
redrob-film-frame = { git = "https://github.com/storytold/filmcraft", rev = "2c5ba7a72619935f0481f99d59409e0d1844b234" }
redrob-film-color = { git = "https://github.com/storytold/filmcraft", rev = "2c5ba7a72619935f0481f99d59409e0d1844b234" }
redrob-film-time = { git = "https://github.com/storytold/filmcraft", rev = "2c5ba7a72619935f0481f99d59409e0d1844b234" }
# encoders + muxer (crates/export)
redrob-film-h264enc = { git = "https://github.com/storytold/filmcraft", rev = "2c5ba7a72619935f0481f99d59409e0d1844b234" }
redrob-film-prores = { git = "https://github.com/storytold/filmcraft", rev = "2c5ba7a72619935f0481f99d59409e0d1844b234" }
redrob-film-aac = { git = "https://github.com/storytold/filmcraft", rev = "2c5ba7a72619935f0481f99d59409e0d1844b234" }
redrob-film-isobmff = { git = "https://github.com/storytold/filmcraft", rev = "2c5ba7a72619935f0481f99d59409e0d1844b234" }
# decoder used as the round-trip oracle of redrob-effects-opusenc (crates/export dev-dependency)
redrob-film-opus = { git = "https://github.com/storytold/filmcraft", rev = "2c5ba7a72619935f0481f99d59409e0d1844b234" }
redrob-film-vp9 = { git = "https://github.com/storytold/filmcraft", rev = "2c5ba7a72619935f0481f99d59409e0d1844b234" }
# decoders used as the round-trip oracles of redrob-effects-hevcenc / redrob-effects-av1enc (dev-dependencies only)
redrob-film-hevc = { git = "https://github.com/storytold/filmcraft", rev = "2c5ba7a72619935f0481f99d59409e0d1844b234" }
redrob-film-av1 = { git = "https://github.com/storytold/filmcraft", rev = "2c5ba7a72619935f0481f99d59409e0d1844b234" }
# timeline interchange (EDL, FCP7 XML, FCPXML, OTIO) for Premiere Pro interop (crates/interchange only)
redrob-film-interchange = { git = "https://github.com/storytold/filmcraft", rev = "2c5ba7a72619935f0481f99d59409e0d1844b234" }
redrob-film-project = { git = "https://github.com/storytold/filmcraft", rev = "2c5ba7a72619935f0481f99d59409e0d1844b234" }
redrob-film-geom = { git = "https://github.com/storytold/filmcraft", rev = "2c5ba7a72619935f0481f99d59409e0d1844b234" }

# gpu (the same wgpu eframe / egui-wgpu use)
wgpu = { version = "30.0.1", features = ["fragile-send-sync-non-atomic-wasm"] }
bytemuck = "1"
pollster = "0.4"

# ui
# Shared frontend components; keep this dependency above the engine boundary.
craft-ui = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "5c874d51eeb3de70e735c8ce87a59a7dedd47675", features = ["serde"] }
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"
cpal = "0.16"
# The operating system's interface language (MIT/Apache-2.0, no dependencies on desktop).
sys-locale = "0.3"

# Local co-development against a FilmCraft checkout next to this repo: uncomment.
# [patch."https://github.com/storytold/filmcraft"]
# redrob-film-codecs = { path = "../filmcraft/crates/codecs" }
# redrob-film-media = { path = "../filmcraft/crates/media" }
# redrob-film-frame = { path = "../filmcraft/crates/frame" }
# redrob-film-color = { path = "../filmcraft/crates/color" }
# redrob-film-time = { path = "../filmcraft/crates/time" }
# redrob-film-h264enc = { path = "../filmcraft/crates/h264enc" }
# redrob-film-prores = { path = "../filmcraft/crates/prores" }
# redrob-film-aac = { path = "../filmcraft/crates/aac" }
# redrob-film-isobmff = { path = "../filmcraft/crates/isobmff" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

# Pixel hot loops: keep debug builds interactive.
[profile.dev.package.redrob-effects-raster]
opt-level = 3

[profile.dev.package.redrob-effects-render]
opt-level = 3

[profile.dev.package.redrob-effects-gpu]
opt-level = 3

[profile.dev.package.redrob-effects-effects]
opt-level = 3

[profile.dev.package.redrob-effects-track]
opt-level = 3

[profile.dev.package.redrob-effects-path]
opt-level = 3

[profile.dev.package.redrob-effects-media]
opt-level = 3

[profile.dev.package.redrob-effects-opusenc]
opt-level = 3

[profile.dev.package.redrob-effects-export]
opt-level = 3

[profile.dev.package.redrob-effects-vp9enc]
opt-level = 3

[profile.dev.package.redrob-effects-hevcenc]
opt-level = 3

[profile.dev.package.redrob-effects-av1enc]
opt-level = 3

# FilmCraft codec hot loops (same settings as FilmCraft's own workspace).
[profile.dev.package.redrob-film-h264]
opt-level = 3

[profile.dev.package.redrob-film-h264enc]
opt-level = 3

[profile.dev.package.redrob-film-hevc]
opt-level = 3

[profile.dev.package.redrob-film-vp9]
opt-level = 3

[profile.dev.package.redrob-film-prores]
opt-level = 3

[profile.dev.package.redrob-film-dnx]
opt-level = 3

[profile.dev.package.redrob-film-av1]
opt-level = 3

[profile.dev.package.redrob-film-aac]
opt-level = 3

[profile.dev.package.redrob-film-opus]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
