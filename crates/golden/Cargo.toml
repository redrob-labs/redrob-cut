[package]
name = "redrob-film-golden"
description = "Golden-image tests for the CPU renderer/compositor and GPU-vs-CPU parity (test-only crate)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

# Test-only: the library is empty and everything is a dev-dependency, so the crate adds no edges
# to the layer graph. Goldens live in `goldens/` (see docs/testing.md §3).
[dependencies]

[dev-dependencies]
redrob-film-testkit = { workspace = true }
redrob-film-color = { workspace = true }
redrob-film-frame = { workspace = true }
redrob-film-time = { workspace = true }
redrob-film-geom = { workspace = true }
redrob-film-media = { workspace = true }
redrob-film-project = { workspace = true }
redrob-film-render = { workspace = true }
redrob-film-gpu = { workspace = true }
pollster = "0.4"
wgpu = { version = "30", features = ["wgsl", "metal", "vulkan", "dx12", "gles"] }
