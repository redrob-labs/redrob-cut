[package]
name = "redrob-film-gpu"
description = "wgpu compositor: YUV/RGB layer sampling, linear-light premultiplied compositing in WGSL"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
redrob-film-color = { workspace = true }
redrob-film-frame = { workspace = true }
redrob-film-geom = { workspace = true }
redrob-film-project = { workspace = true }
redrob-film-render = { workspace = true }
redrob-film-time = { workspace = true }
wgpu = { version = "30", default-features = false, features = ["wgsl"] }
log = { workspace = true }
pollster = "0.4"
rayon = { workspace = true }

[dev-dependencies]
pollster = "0.4"
redrob-film-export = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
wgpu = { version = "30", features = ["wgsl", "metal", "vulkan", "dx12", "gles"] }
redrob-film-media = { workspace = true }
redrob-film-time = { workspace = true }
