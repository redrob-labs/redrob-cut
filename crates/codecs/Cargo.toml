[package]
name = "redrob-film-codecs"
description = "Container + codec hub: MP4/MOV, Matroska, MXF, Ogg and MPEG TS/PS sources, image sequences, GOP-aware seeking, decoder registry, audio decoding"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
redrob-film-time = { workspace = true }
redrob-film-color = { workspace = true }
redrob-film-frame = { workspace = true }
redrob-film-media = { workspace = true }
redrob-film-isobmff = { workspace = true }
redrob-film-matroska = { workspace = true }
redrob-film-mxf = { workspace = true }
redrob-film-mpegts = { workspace = true }
redrob-film-mpeg2v = { workspace = true }
redrob-film-ac3 = { workspace = true }
redrob-film-ogg = { workspace = true }
redrob-film-bitstream = { workspace = true }
redrob-film-h264 = { workspace = true }
redrob-film-hevc = { workspace = true }
redrob-film-vp9 = { workspace = true }
redrob-film-prores = { workspace = true }
redrob-film-dnx = { workspace = true }
redrob-film-av1 = { workspace = true }
redrob-film-apv = { workspace = true }
redrob-film-aac = { workspace = true }
redrob-film-opus = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# Decode timing counters (`gop_stats`); std's Instant panics on wasm32.
web-time = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Bootstrap audio decoding (MPL-2.0, used unmodified); replaced by own decoders over time.
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "mp1", "mp2", "mp3", "flac", "alac", "pcm", "wav", "aiff", "ogg", "vorbis", "isomp4"] }

[dev-dependencies]
redrob-film-testkit = { workspace = true }
serde_json = { workspace = true }
