[package]
name = "redrob-film-render"
description = "Sequence evaluation and CPU reference compositor (linear-light premultiplied f32)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
redrob-film-time = { workspace = true }
redrob-film-geom = { workspace = true }
redrob-film-color = { workspace = true }
redrob-film-frame = { workspace = true }
redrob-film-media = { workspace = true }
redrob-film-project = { workspace = true }
redrob-film-audio-dsp = { workspace = true }
redrob-film-captions = { workspace = true }
redrob-film-text = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

# Thread CPU clock for load-robust performance tests.
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", default-features = false, features = ["std", "time"] }
